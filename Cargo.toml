[package]
name = "handl-plugin-sdkgen-backend-webidl"
version.workspace = true
edition.workspace = true
description = "WebIDL backend for the Handl SDK generator (ADR-0113)."
license.workspace = true
repository.workspace = true

[dependencies]
# ADR-0128 Phase 5: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../platform` checkout.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/platform", rev = "9d34281cc717e007588e31a0f908ef55c81e7deb" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
